name: Publish Document

on:
  push:
    branches:
      - main
      - feature/ai-readability-p0
  workflow_dispatch: # 仍保留手动触发的功能

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Use an isolated Python: pip cannot uninstall apt-installed packages (e.g. Pygments) on the runner image
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Prepare build environment
      run: |
        pip install -U pygments==2.17.2 pymdown-extensions
        pip install mkdocs-exclude
        pip install mkdocs-material==9.6.8
        pip install jieba==0.42.1
        pip install mkdocs-minify-plugin
        pip install mkdocs-static-i18n

    - name: Build the document
      run: mkdocs build

    - name: Add CNAME file
      run: echo 'docs.tronlink.org' > site/CNAME  

    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages       # 部署目标分支
        folder: site           # 构建产物目录
        token: ${{ secrets.GITHUB_TOKEN }}  # 使用 GitHub 默认的 Token

    - name: Verify deployed links
      run: |
        BASE=https://docs.tronlink.org
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null "$BASE/llms.txt"; then
            echo "Site live, running sample verify"
            python3 scripts/gen_llms_full.py --verify "$BASE"
            exit $?
          fi
          echo "Waiting for deploy to propagate ($i/30)..."
          sleep 10
        done
        echo "Timeout (5 min) waiting for $BASE/llms.txt to come up"
        exit 1

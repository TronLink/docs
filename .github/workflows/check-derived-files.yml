name: Check derived files

# Fails when docs/llms-full*.txt or docs/AGENTS.txt were not regenerated
# after a source change. Fix: run `python3 scripts/gen_llms_full.py` and commit.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "scripts/gen_llms_full.py"
      - ".github/workflows/check-derived-files.yml"
  pull_request:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "scripts/gen_llms_full.py"
      - ".github/workflows/check-derived-files.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check llms-full bundles and AGENTS.txt are up to date
        run: python3 scripts/gen_llms_full.py --check
